trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  NodeVersion: '20.x'

steps:

# Checkout
- checkout: self

# Install Node.js
- task: NodeTool@0
  inputs:
    versionSpec: $(NodeVersion)

# Install dependencies
- script: |
    npm install
  displayName: Install Packages

# Build React App
- script: |
    npm run build
  displayName: Build React App

# Copy dist folder to Azure VM
- task: CopyFilesOverSSH@0
  inputs:
    sshEndpoint: 'ssh-connection'
    sourceFolder: '$(System.DefaultWorkingDirectory)/dist'
    contents: '**'
    targetFolder: '/var/www/portfolio'
    cleanTargetFolder: true
    readyTimeout: '20000'

# Restart Nginx
- task: SSH@0
  inputs:
    sshEndpoint: 'ssh-connection'
    runOptions: 'inline'
    inline: 'sudo systemctl restart nginx'
    readyTimeout: '20000'