trigger:

- main


variables:

  imageName: frontend

  acrName: portfolio1.azurecr.io



stages:


# ======================
# BUILD STAGE
# ======================

- stage: Build


  jobs:

  - job: DockerBuild


    pool:

      vmImage: ubuntu-latest


    steps:


    - checkout: self



    - task: Docker@2

      displayName: Build Image

      inputs:

        containerRegistry: acr-connection

        repository: $(imageName)

        command: build

        Dockerfile: Dockerfile

        tags: |

          $(Build.BuildId)



    - task: Docker@2

      displayName: Push Image

      inputs:

        containerRegistry: acr-connection

        repository: $(imageName)

        command: push

        tags: |

          $(Build.BuildId)



# ======================
# DEPLOY STAGE EAST
# ======================


- stage: Deploy_East


  dependsOn: Build


  jobs:


  - deployment: AKS_East


    environment: aks-east


    pool:

      vmImage: ubuntu-latest


    strategy:


      runOnce:


        deploy:


          steps:


          - task: KubernetesManifest@1


            inputs:


              action: deploy


              kubernetesServiceConnection: aks-east-connection


              namespace: default


              manifests: |


                k8s/frontend-deployment.yaml

                


              containers: |


                portfolio1.azurecr.io/frontend:$(Build.BuildId)



# ======================
# DEPLOY WEST
# ======================


- stage: Deploy_West


  dependsOn: Deploy_East


  jobs:


  - deployment: AKS_West


    environment: aks-west


    pool:

      vmImage: ubuntu-latest


    strategy:


      runOnce:


        deploy:


          steps:


          - task: KubernetesManifest@1


            inputs:


              action: deploy


              kubernetesServiceConnection: aks-west-connection


              namespace: default


              manifests: |


                k8s/frontend-deployment.yaml

                


              containers: |


                portfolio1.azurecr.io/frontend:$(Build.BuildId)